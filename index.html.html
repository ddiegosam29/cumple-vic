<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Feliz cumpleaños!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;1,9..144,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff4ee; --bg2:#ffe3ea; --ink:#3b1a33; --soft:#7a5570;
  --rose:#e8789a; --petal:#f6a6bd; --butter:#f6d98b; --sage:#7fa27c;
  --card:#fffaf7; --line:#f1c9d4; --center:#f2b84b;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Script","Comic Sans MS",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#241020; --bg2:#33162d; --ink:#ffeef3; --soft:#d9b3c6;
    --rose:#f08aab; --petal:#c4587f; --butter:#f3cf78; --sage:#97bb93;
    --card:#321a2d; --line:#5a2f50; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241020; --bg2:#33162d; --ink:#ffeef3; --soft:#d9b3c6;
  --rose:#f08aab; --petal:#c4587f; --butter:#f3cf78; --sage:#97bb93;
  --card:#321a2d; --line:#5a2f50; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg) 60%) var(--bg);color:var(--ink);
  font-family:var(--display);line-height:1.65;overflow-x:hidden;min-height:100vh}
.hidden{display:none!important}

/* pétalos que caen */
#petals{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.petal{position:absolute;top:-40px;width:22px;height:22px;color:var(--petal);opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

/* esquinas florales */
.corner{position:fixed;width:min(46vw,230px);color:var(--rose);opacity:.55;pointer-events:none;z-index:0}
.corner.tl{top:-40px;left:-40px}
.corner.br{bottom:-50px;right:-50px;color:var(--sage);transform:rotate(180deg)}
.corner svg{width:100%;height:auto;display:block}

main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:28px 20px 80px}

/* portada: la flor que se abre */
#intro{min-height:88vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
#intro h1{font-weight:400;font-style:italic;font-size:clamp(2rem,8vw,3.2rem);margin:0;letter-spacing:-.01em}
#intro p{font-family:var(--hand);font-size:1.7rem;color:var(--soft);margin:0}
.bloom{width:min(72vw,280px);aspect-ratio:1;background:none;border:0;cursor:pointer;color:var(--rose);padding:0;margin:10px 0;border-radius:50%}
.bloom:focus-visible,.gift:focus-visible,.cta:focus-visible{outline:3px solid var(--butter);outline-offset:4px}
.bloom svg{width:100%;height:100%;overflow:visible;animation:sway 5s ease-in-out infinite}
.bloom .pet{transform-origin:50px 50px;transition:transform .9s cubic-bezier(.2,1.4,.4,1)}
.bloom:hover .pet,.bloom.open .pet{transform:scale(1.12)}
@keyframes sway{50%{transform:rotate(4deg)}}

/* contenido */
#content{animation:reveal 1s ease both}
@keyframes reveal{from{opacity:0;transform:scale(.96)}}
h2{font-weight:400;font-style:italic;font-size:clamp(1.8rem,6vw,2.4rem);text-align:center;margin:56px 0 14px}
.divider{display:flex;justify-content:center;gap:10px;color:var(--rose);margin:0 auto 6px}
.divider svg{width:22px;height:22px}
.divider svg:nth-child(2){color:var(--butter);width:28px;height:28px}

.letter{background:var(--card);border:2px solid var(--line);border-radius:28px 6px 28px 6px;padding:26px 24px;
  font-size:1.12rem;position:relative}
.letter .sig{font-family:var(--hand);font-size:1.9rem;color:var(--rose);text-align:right;margin:10px 0 0}

/* fotos */
.gallery{margin-top:46px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:22px;padding:10px 6px}
.photo{margin:0;background:var(--card);padding:10px 10px 14px;border-radius:6px;border:1px solid var(--line);
  box-shadow:0 8px 20px rgba(120,40,80,.18);transform:rotate(var(--r))}
.photo:nth-child(1){--r:-3deg}.photo:nth-child(2){--r:2deg;margin-top:14px}.photo:nth-child(3){--r:-1.5deg}
.photo .frame{aspect-ratio:4/5;border-radius:100px 100px 6px 6px;overflow:hidden;background:var(--bg2);display:grid;place-items:center;color:var(--petal)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ph svg{width:70%;height:auto}
.photo figcaption{font-family:var(--hand);font-size:1.4rem;text-align:center;margin-top:8px;color:var(--soft)}

/* encuesta */
.poll{background:var(--card);border:2px dashed var(--rose);border-radius:30px;padding:26px 18px;text-align:center}
.poll h2{margin:0 0 4px}
.poll .sub{font-family:var(--hand);font-size:1.5rem;color:var(--soft);margin:0 0 18px}
.gifts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.gift{border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:22px;padding:18px 8px 14px;cursor:pointer;
  font:inherit;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .25s,border-color .25s,background .25s}
.gift svg{width:64px;height:64px;transition:transform .6s cubic-bezier(.2,1.4,.4,1)}
.gift:nth-child(1) svg{color:var(--rose)}.gift:nth-child(2) svg{color:var(--sage)}
.gift:hover:not(:disabled){transform:translateY(-4px)}
.gift:hover:not(:disabled) svg{transform:rotate(60deg) scale(1.1)}
.gift.chosen{border-color:var(--rose);background:var(--bg2)}
.gift.chosen svg{transform:rotate(120deg) scale(1.2)}
.gift:disabled:not(.chosen){opacity:.4;cursor:default}
#result{margin-top:22px;padding:20px;border-radius:20px;background:var(--bg2);border:2px solid var(--rose);animation:reveal .6s ease both}
#result strong{font-size:1.5rem;display:block;font-style:italic}
.code{display:inline-block;margin:10px 0 14px;padding:6px 18px;border-radius:999px;background:var(--card);border:2px dashed var(--sage);
  font-family:var(--hand);font-size:1.9rem;letter-spacing:.06em}
.cta{display:inline-block;background:#1f9d55;color:#fff;text-decoration:none;padding:12px 26px;border-radius:999px;font-size:1.1rem}
.cta:hover{filter:brightness(1.1)}
footer{text-align:center;font-family:var(--hand);font-size:1.5rem;color:var(--soft);margin-top:60px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Flor reutilizable -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="flower" viewBox="0 0 100 100">
    <g class="pet" fill="currentColor">
      <ellipse cx="50" cy="24" rx="12" ry="22"/>
      <ellipse cx="50" cy="24" rx="12" ry="22" transform="rotate(60 50 50)"/>
      <ellipse cx="50" cy="24" rx="12" ry="22" transform="rotate(120 50 50)"/>
      <ellipse cx="50" cy="24" rx="12" ry="22" transform="rotate(180 50 50)"/>
      <ellipse cx="50" cy="24" rx="12" ry="22" transform="rotate(240 50 50)"/>
      <ellipse cx="50" cy="24" rx="12" ry="22" transform="rotate(300 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="11" fill="var(--center)"/>
    <circle cx="50" cy="50" r="5" fill="var(--ink)" opacity=".25"/>
  </symbol>
  <symbol id="leafy" viewBox="0 0 240 240">
    <g fill="currentColor">
      <use href="#flower" x="20" y="20" width="90" height="90"/>
      <use href="#flower" x="110" y="10" width="60" height="60" style="color:var(--petal)"/>
      <use href="#flower" x="10" y="115" width="62" height="62" style="color:var(--butter)"/>
      <ellipse cx="130" cy="110" rx="9" ry="26" transform="rotate(-50 130 110)" style="color:var(--sage)"/>
      <ellipse cx="100" cy="140" rx="9" ry="26" transform="rotate(-20 100 140)" style="color:var(--sage)"/>
    </g>
  </symbol>
</svg>

<div class="corner tl" aria-hidden="true"><svg viewBox="0 0 240 240"><use href="#leafy"/></svg></div>
<div class="corner br" aria-hidden="true"><svg viewBox="0 0 240 240"><use href="#leafy"/></svg></div>
<div id="petals" aria-hidden="true"></div>

<main>
  <section id="intro">
    <p>Tengo algo para ti…</p>
    <button class="bloom" id="bloom" aria-label="Abrir la sorpresa">
      <svg viewBox="0 0 100 100"><use href="#flower"/></svg>
    </button>
    <h1>Toca la flor</h1>
  </section>

  <div id="content" class="hidden">
    <h2 id="title"></h2>
    <div class="divider" aria-hidden="true"><svg><use href="#flower"/></svg><svg><use href="#flower"/></svg><svg><use href="#flower"/></svg></div>

    <article class="letter">
      <p id="msg"></p>
      <p class="sig" id="sig"></p>
    </article>

        <div class="gallery" id="gallery"></div>

    <section class="poll" aria-labelledby="pollTitle">
      <h2 id="pollTitle">Elige tu premio</h2>
      <p class="sub">Solo puedes escoger uno</p>
      <div class="gifts">
        <button class="gift" data-gift="1"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>Regalo 1</button>
        <button class="gift" data-gift="2"><svg viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>Regalo 2</button>
      </div>
      <div id="result" class="hidden" role="status" aria-live="polite"></div>
    </section>

    <footer>Con todo mi cariño 🌸</footer>
  </div>
</main>

/* ================================= */

const $ = (s) => document.querySelector(s);
const flowerSVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>';

// Pétalos que caen
function rain(n = 18) {
  const box = $("#petals"), colors = ["var(--petal)", "var(--rose)", "var(--butter)"];
  for (let i = 0; i < n; i++) {
    const p = document.createElement("span");
    p.className = "petal";
    p.innerHTML = flowerSVG;
    p.style.cssText = `left:${Math.random() * 100}%;color:${colors[i % 3]};` +
      `animation-duration:${5 + Math.random() * 5}s;animation-delay:${Math.random() * 1.5}s;` +
      `--dx:${(Math.random() - .5) * 160}px;--rot:${Math.random() * 720}deg;` +
      `width:${14 + Math.random() * 16}px;height:${14 + Math.random() * 16}px`;
    box.appendChild(p);
    setTimeout(() => p.remove(), 12000);
  }
}

// Rellenar contenido
$("#title").textContent = CONFIG.titulo;
$("#msg").textContent = CONFIG.mensaje;
$("#sig").textContent = CONFIG.firma;
CONFIG.fotos.forEach((f) => {
  const fig = document.createElement("figure");
  fig.className = "photo";
  const frame = document.createElement("div");
  frame.className = "frame";
  if (f.src) {
    const img = document.createElement("img");
    img.src = f.src; img.alt = f.texto || "Foto"; img.loading = "lazy";
    frame.appendChild(img);
  } else {
    frame.classList.add("ph");
    frame.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true"><use href="#flower"/></svg>';
  }
  fig.appendChild(frame);
  if (f.texto) { const cap = document.createElement("figcaption"); cap.textContent = f.texto; fig.appendChild(cap); }
  $("#gallery").appendChild(fig);
});

// Abrir la flor
$("#bloom").addEventListener("click", () => {
  $("#bloom").classList.add("open");
  rain(30);
  setTimeout(() => {
    $("#intro").classList.add("hidden");
    $("#content").classList.remove("hidden");
    window.scrollTo({ top: 0 });
  }, 900);
});

// Encuesta
document.querySelectorAll(".gift").forEach((btn) => {
  btn.addEventListener("click", () => {
    const n = btn.dataset.gift, premio = CONFIG.premios[n];
    document.querySelectorAll(".gift").forEach((b) => { b.disabled = true; });
    btn.classList.add("chosen");
    const msg = encodeURIComponent(`Hola, quiero canjear mi Regalo ${n}. Código: ${premio.codigo}`);
    const res = $("#result");
    res.innerHTML = `<strong></strong><span class="code"></span><br><a class="cta" target="_blank" rel="noopener">Canjear por WhatsApp</a>`;
    res.querySelector("strong").textContent = premio.texto;
    res.querySelector(".code").textContent = premio.codigo;
    res.querySelector("a").href = `https://wa.me/${CONFIG.whatsapp}?text=${msg}`;
    res.classList.remove("hidden");
    rain(26);
    res.scrollIntoView({ behavior: "smooth", block: "center" });
  });
});
</script>
